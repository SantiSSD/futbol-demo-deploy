# ============================================================
# Reverse proxy de la demo (nginx del HOST del VPS).
#
# Instalacion:
#   sudo cp nginx/demo.conf /etc/nginx/sites-available/futbol-demo.conf
#   sudo ln -s /etc/nginx/sites-available/futbol-demo.conf /etc/nginx/sites-enabled/
#   # reemplazar "tudominio.com" por tu dominio real en el archivo copiado
#   sudo nginx -t && sudo systemctl reload nginx
#   # TLS automatico (agrega 443 + redirect 80->443):
#   sudo certbot --nginx -d demo.tudominio.com -d api-demo.tudominio.com
#
# El header X-Forwarded-Proto es clave: hace que la API vea las requests como
# HTTPS (asi la cookie del refresh token sale con flag Secure).
# ============================================================

# ---------- Frontend (SPA servida por nginx del contenedor) ----------
server {
    listen 80;
    server_name demo.tudominio.com;   # <-- reemplazar

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- API (backend .NET en modo demo) ----------
server {
    listen 80;
    server_name api-demo.tudominio.com;   # <-- reemplazar

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
