# ============================================================
# Reverse proxy de la demo (nginx del HOST del VPS).
# UN solo dominio, ruteo por path:
#   /       -> frontend (SPA en 127.0.0.1:5173)
#   /api/   -> backend  (API .NET en 127.0.0.1:5001)
#
# Instalacion:
#   sudo cp nginx/demo.conf /etc/nginx/sites-available/futbol-demo.conf
#   sudo nano /etc/nginx/sites-available/futbol-demo.conf   # reemplazar el dominio
#   sudo ln -s /etc/nginx/sites-available/futbol-demo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d futbol-complejo-demo.duckdns.org   # TLS automatico
#
# El header X-Forwarded-Proto es clave: hace que la API vea las requests como
# HTTPS (asi la cookie del refresh token sale con flag Secure).
# ============================================================

server {
    listen 80;
    server_name futbol-complejo-demo.duckdns.org;   # <-- tu dominio

    # ---------- API (.NET en modo demo) ----------
    # Rutea /api/... al backend. Sin barra final en proxy_pass para preservar el path.
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Frontend (SPA servida por nginx del contenedor) ----------
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
